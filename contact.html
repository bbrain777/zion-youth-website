<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="Contact ZION Youths Development Initiative for inquiries, partnerships, or support." />
  <title>Contact - ZION Youths</title>
  <link rel="icon" type="image/png" href="images/Zion_youth_logo.png" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto&display=swap"
    rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css?v=20260307e" />

  <!-- JavaScript -->
  <script src="js/main.js?v=20260307d" defer></script>
</head>

<body>
  <header>
    <nav class="navbar">
      <div class="logo">ZION Youths</div>
      <button class="menu-toggle" aria-label="Toggle navigation">&#9776;</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="donate.html">Donate</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <button id="theme-toggle" aria-label="Toggle theme">&#127769;</button>
    </nav>
  </header>

  <main>
    <section class="hero small">
      <h1>Contact Us</h1>
      <p>We'd love to hear from you. Reach out for collaborations, questions, or support.</p>
    </section>

    <section class="contact-form-section container">
      <form class="contact-form">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
      <p id="contact-thankyou" class="thank-you hidden" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 ZION Youths Development Initiative</p>
      <p><a href="references.html">References</a></p>
    </div>
  </footer>
</body>

</html>
